<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Песочница дорог</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap"
    />
    <style>
      :root {
        --ink: #0f1418;
        --panel: rgba(15, 20, 24, 0.82);
        --edge: rgba(233, 236, 233, 0.16);
        --text: #eef1ed;
        --muted: #97a493;
        --mark: #e8e4d2;
        --sans: 'IBM Plex Sans Condensed', 'Segoe UI', system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: var(--sans);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      canvas { display: block; touch-action: none; }

      .layer {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(14px, 2.4vw, 26px);
        gap: 12px;
        pointer-events: none;
      }

      .top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; }

      .mark {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        backdrop-filter: blur(8px);
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mark);
        line-height: 1.5;
      }
      .mark span { display: block; color: var(--muted); letter-spacing: 0.08em; font-weight: 500; }
      .mark span.fresh { color: #a9e0b0; }

      /* Что нового в этой сборке: чтобы было видно, ту ли версию открыли */
      .news {
        align-self: end;
        justify-self: start;
        max-width: min(400px, 42vw);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        backdrop-filter: blur(8px);
        padding: 12px 14px;
        pointer-events: auto;
        display: none;
        z-index: 5;
      }
      .news.open { display: block; }
      .mark span { cursor: pointer; }
      .news h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .news ol { margin: 0; padding-left: 1.1em; font-size: 12.5px; line-height: 1.55; color: var(--text); }
      .news li { margin-bottom: 5px; }
      .news li:last-child { margin-bottom: 0; }
      .news button {
        margin-top: 10px;
        appearance: none;
        border: 1px dashed var(--edge);
        background: transparent;
        color: var(--muted);
        font: 600 11px/1 var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 7px 10px;
        border-radius: 2px;
        cursor: pointer;
      }
      .news button:hover { color: var(--text); }

      .views {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 4px;
        backdrop-filter: blur(8px);
      }

      .views button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: 600 12px/1 var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 12px;
        border-radius: 2px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .views button:hover { color: var(--text); }
      .views button[aria-pressed='true'] { background: var(--mark); color: #14181a; }
      .views button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
      .views button.plain { color: var(--muted); border: 1px dashed var(--edge); }
      .views button.plain:hover { color: var(--text); }

      .group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 4px 4px 4px 12px;
        backdrop-filter: blur(8px);
      }
      .group > .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .group .views { background: none; border: 0; padding: 0; backdrop-filter: none; }

      .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }

      .readout {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 12px 16px;
        backdrop-filter: blur(8px);
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .readout h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        margin: 0;
        font-family: var(--mono);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .facts div { display: flex; gap: 8px; }
      .facts b { color: var(--text); font-weight: 500; }

      .hint {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        backdrop-filter: blur(8px);
        padding: 9px 13px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--muted);
        text-align: right;
      }

      .hint.refused { color: #f0c98a; border-color: rgba(240, 201, 138, 0.45); }
      .hint.snapped { color: #a9e0b0; border-color: rgba(169, 224, 176, 0.5); }

      @media (max-width: 620px) {
        .hint { display: none; }
        .facts { font-size: 11px; gap: 4px 14px; }
      }
    </style>
  </head>
  <body>
    <div class="layer">
      <div class="top">
        <div class="mark">lifeboonremake<span id="build">сборка не отмечена</span></div>
        <div class="group"><span class="tag">ракурс</span>
          <div class="views" id="views" role="group" aria-label="Ракурс"></div>
        </div>
        <div class="group"><span class="tag">строить</span>
          <div class="views" id="tools" role="group" aria-label="Строительство"></div>
        </div>
        <div class="group"><span class="tag">сетка</span>
          <div class="views" id="wire" role="group" aria-label="Сетка треугольников"></div>
        </div>
        <div class="group"><span class="tag">правила</span>
          <div class="views" id="traffic" role="group" aria-label="Сеть движения"></div>
        </div>
        <div class="group"><span class="tag">движение</span>
          <div class="views" id="living" role="group" aria-label="Живое движение"></div>
        </div>
        <div class="group"><span class="tag">вариант</span>
          <div class="views" id="variants" role="group" aria-label="Вариант"></div>
        </div>
        <div class="group"><span class="tag">рельеф</span>
          <div class="views" id="terrains" role="group" aria-label="Рельеф"></div>
        </div>
        <div class="group"><span class="tag">сцена</span>
          <div class="views" id="scenes" role="group" aria-label="Сцена"></div>
        </div>
      </div>
      <div class="news" id="news">
        <h2 id="news-when">что нового</h2>
        <ol id="news-list"></ol>
        <button type="button" id="news-close">скрыть</button>
      </div>
      <div class="bottom">
        <div class="readout">
          <h1 id="road-name">—</h1>
          <div class="facts" id="facts"></div>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
