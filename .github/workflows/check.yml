# Проверка на каждый push и каждый pull request.
#
# Зачем: `npm test` надо не забыть запустить, а забытая проверка однажды будет
# забыта — в этом проекте так было дважды. GitHub не забывает.
#
# Две работы, и обе обязательны.
#
# Раньше здесь была только быстрая половина, а про браузерную было написано,
# что она «гоняется руками перед выкладкой». 16 сентября выяснилось, что руками
# её не гоняли: сайт выложили дважды, и только потом оказалось, что поездка
# в браузере падает. Проверка, которую надо не забыть запустить, однажды будет
# забыта — это и есть причина, по которой весь этот файл существует, и на
# браузерную половину она распространяется ровно так же.

name: проверка

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  без-браузера:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm test быстро
        run: npm test быстро

  браузер:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: поставить Chromium
        run: npx playwright install --with-deps chromium
      - name: npm test браузер
        run: npm test браузер
