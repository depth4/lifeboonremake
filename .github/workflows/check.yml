# Проверка на каждый push и каждый pull request.
#
# Зачем: `npm test` надо не забыть запустить, а забытая проверка однажды будет
# забыта — в этом проекте так было дважды. GitHub не забывает.
#
# Две работы, и обе обязательны.
#
# Раньше здесь была только быстрая половина, а про браузерную было написано,
# что она «гоняется руками перед выкладкой». 16 сентября выяснилось, что руками
# её не гоняли: сайт выложили дважды, и только потом оказалось, что поездка
# в браузере падает. Проверка, которую надо не забыть запустить, однажды будет
# забыта — это и есть причина, по которой весь этот файл существует, и на
# браузерную половину она распространяется ровно так же.
#
# Имена работ (bystro, brauzer) — латиницей, и это не вкус. С 15 по 23 сентября
# работы звались «без-браузера» и «браузер»; GitHub принимает в имени работы
# только латиницу, цифры, «-» и «_», поэтому файл целиком считался нечитаемым.
# Все 32 запуска кончились «провалом» в ту же секунду, без единой работы, —
# проверка не выполнилась ни разу, а казалось, что она есть. Русское имя,
# которое видно на GitHub, живёт в «name:».

name: проверка

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  bystro:
    name: без браузера
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm test быстро
        run: npm test быстро

  brauzer:
    name: браузер
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: поставить Chromium
        run: npx playwright install --with-deps chromium
      - name: npm test браузер
        run: npm test браузер
